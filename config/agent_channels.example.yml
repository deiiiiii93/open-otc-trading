default:
  channel: zenmux
  model: anthropic/claude-sonnet-4.6

channels:
  - name: zenmux
    label: Zenmux
    type: zenmux
    api_key_env: ZENMUX_API_KEY
    base_url: https://zenmux.ai/api/v1
    anthropic_base_url: https://zenmux.ai/api/anthropic
    models:
      - id: anthropic/claude-opus-4.8
        provider: anthropic
        label: Claude Opus 4.8
        description: Most capable, highest cost
        tags: [tool-use, reasoning, premium]
      - id: anthropic/claude-sonnet-4.6
        provider: anthropic
        label: Claude Sonnet 4.6
        tags: [tool-use, reasoning]
      - id: anthropic/claude-sonnet-5
        provider: anthropic
        label: Claude Sonnet 5
        tags: [tool-use, reasoning]
      - id: anthropic/claude-haiku-4.5
        provider: anthropic
        label: Claude Haiku 4.5
        tags: [fast]
      - id: openai/gpt-5.5
        provider: openai
        label: GPT-5.5
        tags: [tool-use]
      - id: openai/gpt-5.6-terra
        provider: openai
        label: GPT-5.6 Terra
        tags: [tool-use, reasoning]
      - id: openai/gpt-5.6-luna
        provider: openai
        label: GPT-5.6 Luna
        tags: [tool-use, reasoning]
      - id: openai/gpt-5.6-sol
        provider: openai
        label: GPT-5.6 Sol
        tags: [tool-use, reasoning]
      - id: google/gemini-2.5-pro
        provider: openai
        label: Gemini 2.5 Pro
        tags: [tool-use, reasoning]
      - id: google/gemini-3.1-pro-preview
        provider: openai
        label: Gemini 3.1 Pro
        tags: [tool-use, reasoning]
      # Third-party vendors routed through Zenmux's OpenAI-compatible gateway.
      # provider must be 'openai' (the dispatch SDK label); the real vendor lives
      # in the id. Keep in sync with CANDIDATE_MODELS in services/arena/models.py.
      - id: z-ai/glm-5.2
        provider: openai
        # Fourth model needing this pin (2026-07-29, board 92). Through the
        # OpenAI-compatible gateway glm-5.2 emits tool calls whose "id" is an
        # EMPTY STRING under full orchestrator load. deepagents' task() guards
        # `if not runtime.tool_call_id: raise` -- so EVERY persona delegation
        # raised before a subagent started, no persona ever ran, and the model
        # scored GRD 0 / SYN 0 / PRC 0 (obj 14.3) despite reasoning correctly
        # about the failure and honestly declining the trap step. Same class as
        # minimax / qwen3.7-max / longcat below.
        # NOTE: not reproducible on an isolated probe -- simple, streaming,
        # parallel and direct task() calls all return valid ids. It needs the
        # real match (full prompt + toolset + history), so verify any change to
        # this line against a live match, never a probe.
        protocol: anthropic
        label: GLM 5.2
        tags: [tool-use, reasoning]
      - id: z-ai/glm-5.3
        provider: openai
        # Starts pinned by INHERITANCE from glm-5.2 above, not by its own
        # evidence. The empty tool-call-id defect is a gateway/vendor-family
        # trait rather than a version one, and it surfaces only under a real
        # match -- so a new GLM arrives pinned and may be un-pinned only against
        # a live match that proves it unnecessary.
        protocol: anthropic
        label: GLM 5.3
        tags: [tool-use, reasoning]
      - id: moonshotai/kimi-k2.7-code
        provider: openai
        label: Kimi 2.7
        tags: [tool-use, reasoning]
      - id: minimax/minimax-m3
        provider: openai
        # minimax emits Anthropic-format tool calls; the OpenAI-compatible gateway
        # leaves them unparsed (they leak into text as <invoke ...> markup), so
        # dispatch it through the Anthropic endpoint. provider stays 'openai' (the
        # gateway routing label); protocol overrides only the wire format.
        protocol: anthropic
        label: MiniMax M3
        tags: [tool-use]
      - id: xiaomi/mimo-v2.5-pro
        provider: openai
        label: MiMo V2.5 Pro
        tags: [tool-use]
      - id: deepseek/deepseek-v4-pro
        provider: openai
        label: DeepSeek V4 Pro
        tags: [tool-use, reasoning]
      - id: qwen/qwen3.7-max
        provider: openai
        # qwen's tool-call id arrives empty through the OpenAI-compatible gateway in
        # the full agent flow, breaking subagent (task) dispatch with "Tool call ID
        # is required for subagent invocation". The Anthropic endpoint assigns
        # server-side toolu_ ids that can't be empty. provider stays 'openai' (gateway
        # label); protocol overrides only the wire format.
        protocol: anthropic
        label: Qwen 3.7 Max
        tags: [tool-use, reasoning]
      # --- Run #9 flash-tier candidate field (Zenmux OpenAI-compatible) ---
      - id: bytedance/doubao-seed-evolving
        provider: openai
        label: Doubao Seed Evolving
        tags: [fast, tool-use]
      - id: bytedance/doubao-seed-2.1-turbo
        provider: openai
        label: Doubao Seed 2.1 Turbo
        tags: [fast, tool-use]
      - id: bytedance/doubao-seed-2.1-pro
        provider: openai
        # Frontier-tier Doubao sibling of the 2.1-turbo flash route. Live-probed
        # on the OpenAI-compatible gateway: tool calls arrive parsed with
        # non-empty ids, so it needs NO protocol: anthropic pin (unlike
        # minimax-m3 / qwen3.7-max / longcat-2.0 above). Deliberately NOT tagged
        # 'fast' — that tag is load-bearing for the memory extractor fallback.
        label: Doubao Seed 2.1 Pro
        tags: [tool-use, reasoning]
      - id: qwen/qwen3.7-plus
        provider: openai
        label: Qwen 3.7 Plus
        tags: [fast, tool-use]
      - id: stepfun/step-3.7-flash
        provider: openai
        label: Step 3.7 Flash
        tags: [fast, tool-use]
      - id: google/gemini-3.5-flash
        provider: openai
        label: Gemini 3.5 Flash
        tags: [fast, tool-use]
      # `confirmation_extractor` is the dedicated tag for the trade-confirmation
      # parser (services/confirmations). Tag exactly ONE model with it, and that
      # model MUST be vision-capable: scanned/image-only confirmations are sent as
      # image content parts, and a text-only model fails the document outright
      # rather than silently degrading. Resolution is two-tier —
      # confirmation_extractor -> fast -> registry default — so a missing/typo'd
      # tag costs the cheap tier, never the expensive agent default.
      - id: google/gemini-3.6-flash
        provider: openai
        label: Gemini 3.6 Flash
        tags: [fast, tool-use, confirmation_extractor]
      - id: google/gemini-3.7-flash
        provider: openai
        label: Gemini 3.7 Flash
        tags: [fast, tool-use]
      - id: openai/chat-latest
        provider: openai
        label: GPT-5.5 Instant
        tags: [fast, tool-use]
      - id: deepseek/deepseek-v4-flash
        provider: openai
        label: DeepSeek V4 Flash
        # 'extractor' pins this as the memory diff-extraction model (cheap, JSON).
        # Routed via Zenmux's OpenAI-compatible gateway, so it shares ZENMUX_API_KEY
        # and needs no langchain-deepseek — unlike the deepseek-channel entry below.
        tags: [fast, tool-use, reasoning, extractor]
      - id: xiaomi/mimo-v2.5
        provider: openai
        label: MiMo V2.5
        tags: [fast, tool-use]
      - id: tencent/hy3
        provider: openai
        label: Hunyuan 3
        tags: [fast, tool-use]
      - id: meituan/longcat-2.0
        provider: openai
        # longcat emits tool calls as <longcat_tool_call> markup that the OpenAI-
        # compatible gateway leaves unparsed (they leak into the response text →
        # zero tool calls → arena prohibition floor). Route it through the Anthropic
        # endpoint so ZenMux translates its native tool calls into structured
        # tool_use. provider stays 'openai' (gateway routing label); protocol
        # overrides only the wire format. See minimax-m3 / qwen3.7-max above.
        protocol: anthropic
        label: LongCat 2.0
        tags: [tool-use, reasoning]
      - id: x-ai/grok-4.5
        provider: openai
        label: Grok 4.5
        tags: [tool-use, reasoning]
      - id: x-ai/grok-4.6
        provider: openai
        label: Grok 4.6
        tags: [tool-use, reasoning]

  - name: deepseek
    label: DeepSeek
    type: openai_compatible
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    models:
      - id: deepseek-v4-flash
        provider: deepseek
        label: DeepSeek V4 Flash
        description: Fast, low-cost reasoning
        tags: [fast, reasoning]
      - id: deepseek-v4-pro
        provider: deepseek
        label: DeepSeek V4 Pro
        description: Higher-capability reasoning tier
        tags: [reasoning]
