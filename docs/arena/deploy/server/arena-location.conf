# Serve the generated arena blog as static files.
#
# nginx picks the LONGEST matching prefix, so this wins over `location /`
# (which proxies to the open-slides-zero SPA) regardless of ordering. The
# `=404` is load-bearing: without it a missing file would fall through and the
# SPA would answer 200 for everything, which is exactly the failure the deploy
# verifier probes for.
#
# NEVER use `add_header` in this block. nginx inherits add_header directives
# from the server level "if and only if there are no add_header directives
# defined on the current level" — so a single Cache-Control line here silently
# discards CSP, HSTS, X-Frame-Options, nosniff, Referrer-Policy AND
# Permissions-Policy for every /arena/ response. That shipped once and the
# deploy verifier called it healthy, because it only checked status and body.
# `expires` belongs to a different directive family and does not trigger the
# replacement rule, so caching and the inherited security headers coexist.
location /arena/ {
    alias /var/www/arena/;
    index index.html;
    try_files $uri $uri/ =404;
    expires 5m;
}
