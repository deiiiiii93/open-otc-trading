# Which arena runs are published boards, and which workflow each one covers.
#
# A run is NOT a board: the arena database holds one-model smokes and A/B probes
# on the same workflows as the real fields. Only the runs listed here reach the
# leaderboard page. Scores are never written here — collect_boards.py derives
# every number from the database.
#
# Required: run, workflow.  Optional: label (defaults to "Run #<n>"), post.
#
# `provisional:` lists runs published as CARDS ONLY — never on the leaderboard.
# A one-model smoke has no field, so a rank of #1 of 1 measures nothing; but an
# ability card is an ABSOLUTE measurement (passed/total per axis, EFF against
# each workflow's own par), so it stays meaningful with no opponent. That is the
# same asymmetry that lets a consolidated card average across workflows while
# the leaderboard never merges runs.
# Required: run.  Optional: label, note.
#
# Card-era boards only. Runs #8 and #9 are deliberately absent: their reports
# ranked models on a blended objective+judge score that the 2026-07-05 scoring
# reform retired, so re-deriving them on today's objective axis reorders their
# own published podium. They stay readable as reports rather than being
# republished under a ranking their text does not support.

boards:
  - run: 133
    workflow: confirmation-desk-day
    post: 2026-08-30-run133-confirmation-desk-day.md
    note: >-
      The first board on a vision workflow: four `vision`-tagged models, two
      trials each, on a harness repaired after a pilot run found three defects
      that each cost a real contestant real points. EFF is UNCALIBRATED here --
      the workflow declares no par_tool_calls, so efficiency is scored against a
      theoretical minimum of 9 tool calls and every EFF lands in 10-24; par was
      deliberately not set because the calibration instrument is the median of
      FULLY-CORRECT trials and this board produced none. Read the ranking as
      consistency, procedure and volume rather than as a vision ranking: three of
      the four designed vision traps are saturated at 8/8 across the whole field,
      and 22 of 28 checks carry no ability signal. Two arms were re-run:
      glm-5-3-flash after a transport-level RemoteProtocolError cost it one of
      two trials (at full depth it places second rather than first), and
      gemini-3-7-flash RE-SCORED 2026-08-31 after two cross-contestant read
      channels in the harness were found and closed -- its first two
      measurements (objective 81.8, then 86.3) included values read from other
      contestants' stored results, and its clean run lands at 77.3 with GRD 59,
      identical to gpt-5-6-luna's, because both fail the same deterministic
      conf-08 extraction-pipeline wall. Neither GRD 59 is a sight deficit; this
      workflow's grounding axis partly measures the contestant-routed
      extraction sub-call. Full history in the report's correction and
      resolution sections.

  - run: 20
    workflow: risk-manager-control-day
    post: 2026-07-13-run20-otc-desk-agent-arena.md

  - run: 33
    workflow: trader-rfq-booking-day
    post: 2026-07-20-run33-otc-desk-agent-arena.md

  - run: 94
    workflow: high-board-portfolio-review-day
    post: 2026-07-29-run94-otc-desk-agent-arena.md

  # No report: the field was run and scored, but never written up.
  - run: 101
    workflow: risk-limit-breach-day
    note: >-
      RESCORED 2026-08-27. This workflow had never declared a par_tool_calls, so
      EFF was scored against the theoretical minimum of 11 tool calls — a target
      no trial in the arena's history has ever come close to (the leanest is 15).
      It now declares a calibrated par of 25, the median of the 31 fully-correct
      trials ever recorded on it, which moves EFF from a 19-56 band to 2-99 and
      changes the rank of 10 of these 18 rows. Cards are derived on read, so the
      figures below are the recalculated ones and no longer match any earlier
      published version of this board. Read the top with care: the leading four
      tie at OVR 98 on identical grounding, adherence and synthesis, so their
      order is settled by EFF and then PRC — which places Grok 4.5 third despite
      a perfect 100.0 objective score. 34 of this workflow's 36 checks now pass
      for every contestant; it no longer separates a strong field.

provisional:
  - run: 134
    label: "Run #134 — Gemini 3.8 Flash, the first board after the thought-signature fix"
    post: 2026-09-03-run134-gemini38-flash.md
    note: >-
      Gemini 3.8 Flash across all SIX golden workflows at xhigh, published as
      cards only: one model has no field, so a rank of #1 of 1 would measure
      nothing, and six workflows cannot be folded into a single leaderboard row.
      Two trials per cell EXCEPT confirmation-desk-day, which carries ONE — its
      second trial was lost to a ZenMux 402 quota exhaustion and recorded
      invalid/infra_blank rather than scored, so that workflow's CON is not
      measured rather than perfect. Zero truncation and zero malformed tool calls
      across all six arms, measured rather than assumed.
      This is the FIRST board to run after the Gemini thought-signature fix.
      Gemini 3 routes return an encrypted signature beside every tool call and
      require it echoed back on the assistant turn carrying that call;
      ChatOpenAI does not preserve that field by design, so the second model
      turn of every tool loop was refused with a 400 and this run initially
      failed on all six workflows. The control is what settles the reading:
      gemini-3.7-flash, which has four published boards on this same route,
      fails identically once the field is stripped. So the enforcement is new,
      not the model, and no earlier board's numbers move.
      The finding is correctness bought at a price that outweighs it. Against
      the gemini-3.7-flash arm of run #129 — same route, same xhigh effort,
      the five workflows they share — 3.8 is 2.8 objective points BETTER (97.1
      against 94.3, ahead on four of the five, with a perfect 100.0 on two
      workflows). It spends 84% MORE tool calls to get there (96 against 52),
      and EFF collapses from 31 to 4. The efficiency loss more than eats the
      correctness gain: mean OVR over those same five workflows is 80.6 against
      3.7's 83.0, so AT THIS EFFORT the newer model finishes 2.4 points behind its
      predecessor while being the more accurate of the two. EFF is 0 on four of
      the six workflows, and the vision workflow alone took 490 tool calls.
      CORRECTED 2026-09-04 — read this card as a measurement of xhigh, not of
      the model. A follow-up arm (run #137) pinned the same model to low on
      ops-settlement-day: it cut filesystem search calls by 94%, from 36 to 2,
      and total calls by 56%, posting OVR 89 there against 83 at xhigh and 85
      for its predecessor — the best cell measured on that workflow. The
      over-execution this card reports is substantially an effort setting
      rather than a model trait, and the desk default is low. A low arm across
      all six workflows has not been measured, so no low card is published.

