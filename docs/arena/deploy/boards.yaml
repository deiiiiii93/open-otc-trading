  - run: 115
    note: >-
      A single-model smoke across all five golden workflows, one trial each —
      cards only, for the same reasons as Run #113: no field means no
      rank, and one trial cannot disperse, so CON is not measured. This is also
      the FIRST run after the Anthropic-protocol output budget was raised from
      langchain's 4096-token fallback to 32768. GLM 5.3 routes over that
      protocol, and the capped attempt (Run #114, unpublished) truncated on
      5-13% of its calls per workflow — a truncated turn emits reasoning and
      nothing else, so it produced no text and no tool call at all. That attempt
      averaged OVR 72 against 84 here, with risk-manager-control-day moving
      67 → 87 on the budget alone. Read EFF against the older boards with care:
      every Anthropic-protocol contestant on them ran under a cap this run did
      not.
      RESCORED 2026-08-27: risk-limit-breach-day and ops-settlement-day were
      given calibrated pars (25 and 30) where they previously had none, so EFF
      on those two workflows was being scored against a theoretical minimum no
      real run achieves. Cards derive on read, so this card's figures are the
      recalculated ones; the affected per-workflow OVRs rose by 1 to 9 points
      and every other workflow is unchanged.

  - run: 132
    label: "Run #132 — GLM 5.3 at max, the sibling control for run #131"
    post: 2026-08-28-run131-flash-newcomers.md
    note: >-
      GLM 5.3 across all five golden workflows at `max`, one trial per cell — run
      deliberately as the like-for-like control for GLM 5.3 Flash in run #131, and
      published as cards for the same reason: five workflows in one run cannot be
      folded into a ranked board row. It exists because GLM 5.3's only other full
      board is run #115, at UNPINNED vendor-default effort and from before the
      upstream pinning and the trap fix, so differencing that against #131 would
      have charged the flash model for a harness repair and an effort change at
      once. The re-run justified itself: at `max` on today's harness GLM 5.3
      completes high-board-portfolio-review-day in 17 tool calls where run #115
      took 41. Against its flash sibling it is 2.2 objective points ahead for a
      7.8-point OVR gap, all of it EFF, on 57% fewer tool calls — except on the
      flagship, where both models score EFF 0 and the pro model is no leaner (54
      calls against 58). The flagship arm died twice on transport errors
      (APIConnectionError, recorded `invalid`/`infra_error`, never scored as a
      model failure) and is taken from the third, clean attempt via `--resume 132`.

  - run: 131
    label: "Run #131 — two flash-tier newcomers at max effort"
    post: 2026-08-28-run131-flash-newcomers.md
    note: >-
      GLM 5.3 Flash and Qwen 3.8 Flash, published 2026-08-26 and 2026-08-27, across
      all five golden workflows at `max` — cards only, because a two-model run over
      five workflows has no field to rank within and folding five workflows into one
      row would publish a cross-workflow average under a single workflow's heading.
      ONE TRIAL PER CELL, so CON is not measured rather than perfect, and every
      figure is a single sample; the run #129 cards these are read against were
      measured at two trials. Both models are competitive on correctness — they post
      the highest objective score any contestant has recorded on
      trader-rfq-booking-day (95.2) and tie the best on the flagship (94.9) — and
      place sixth and seventh of nine on EFF alone, which is zero in five of their
      ten cells. Both are pinned to the Anthropic wire protocol: Qwen's `alibaba`
      upstream returns tool-call continuation deltas with an empty id (263 of 263
      measured), which would otherwise floor every match at 7.7.

  - run: 129
    label: "Run #129 — flash tier at each model's effort ceiling"
    post: 2026-08-26-run129-flash-tier-board.md
    note: >-
      A real seven-model field, but across all five golden workflows at once, so
      it is published as cards rather than a ranked board: a leaderboard section
      covers one workflow, and folding five into a single row per contestant
      would publish a cross-workflow average under one workflow's heading. Two
      trials per cell. This is the first flash-tier field measured after four
      harness defects were fixed — the Anthropic-protocol 4096-token output cap,
      the unpinned ZenMux upstream lottery, the unmeasurable truncated turn and
      malformed tool call, and the dead trap step — so it is NOT comparable to
      runs #8-#126 for these models. Every model ran at its OWN measured effort
      ceiling (max, xhigh or high depending on the route), which makes this a
      capability measurement, not a shippable configuration; run #130 is
      the same field pinned to `low`.

  - run: 130
    label: "Run #130 — the same field at low effort"
    post: 2026-08-26-run129-flash-tier-board.md
    note: >-
      The paired arm of run #129: identical models, workflows, trials, output
      budget and commit, with every contestant pinned to `low` so effort is the
      only variable and each model is its own control. The ranking reorders —
      Gemini 3.7 Flash goes from third to first and leads on both axes — and
      four of seven models score HIGHER here than at their ceiling, because
      lower effort cuts tool calls and EFF is the axis with the widest spread.
      On the 25 of 35 paired cells where both arms have enough trial
      consistency to be readable, `low` costs a mean 2.4 objective points, and
      under one point for three of the four models with a clean sample. Four
      arms were swept to invalid by a network outage and re-run with
      `--resume 130`; all 35 are scored at the same effort and budget.
