- file: 2026-09-22-jev-limit-review.md
  date: 2026-09-22
  tags: [research]
  chips: ["4 questions", "12 held-out cases", "225 live calls"]
  title: "Can Jev read a limit waiver?"
  blurb: >
    Jev now reads the text on a limit breach: how complete a waiver's reason is, which
    claims it makes, and where the comment thread leaves the incident, while code checks
    the claims against the database. On twelve held-out rationales it matched the hand
    grade on eleven, and its own confidence flagged the miss. On 98 comments that models
    wrote in the arena, it showed two states our option set lacks. The first waiver we
    saw a model write graded 3 of 4, because it honestly recorded no owner.
  publish: true

- file: 2026-09-21-jev-system-one.md
  date: 2026-09-21
  tags: [research]
  chips: ["1 classifier", "3 integrations", "234 live calls"]
  title: "How does Jev boost our OTC trading agent?"
  blurb: >
    TypeSafe's Jev is a classifier that cannot write a word or call a tool. We put it in
    three places on the desk and made 234 live calls. Under the wording we shipped, the AUTO
    guard flagged all 30 trap calls we ran and was reached from inside a real persona turn;
    every false alarm traced to how we worded the question, and a post-hoc rewording -- not
    shipped -- cleared nine of nine held-out controls. It moves no arena score, by design.
  publish: true

- file: 2026-09-03-run134-gemini38-flash.md
  date: 2026-09-03
  tags: [research]
  run: "Run #134"
  chips: ["1 model", "6 workflows", "2 efforts", "corrected"]
  title: "The newer Gemini looked like a regression. We had it on the wrong effort."
  blurb: >
    Gemini 3.8 Flash wins four of five workflows on correctness and still finishes behind
    the model it replaces, spending five times as much on filesystem searching at an
    identical hit rate. Two controls then take the finding apart: one fifth of the gap was
    a change we made to the harness, and the rest is reasoning effort. Re-run at `low`
    across all six workflows it spends 53% fewer calls, gives up 1.8 objective points, and
    its overall rating rises from 79 to 86 -- a better card than the model it was supposed
    to have regressed from.
  publish: true

